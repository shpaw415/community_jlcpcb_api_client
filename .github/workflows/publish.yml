name: Publish to npm

on:
  push:
    branches: [main]
    paths: [packages/typescript/package.json]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: package
        run: |
          echo "name=$(node -p "require('./packages/typescript/package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./packages/typescript/package.json').version")" >> "$GITHUB_OUTPUT"

      - id: npm
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.npm.outputs.publish == 'true'
        run: bun install --frozen-lockfile
      - if: steps.npm.outputs.publish == 'true'
        run: bun test
      - if: steps.npm.outputs.publish == 'true'
        run: bun run build
      - if: steps.npm.outputs.publish == 'true'
        working-directory: packages/typescript
        run: npm publish --access public --provenance
